# Simulator-only: None security is insecure.
# Read-only access requires OPC UA Server-enforced denial of writes for this account.
# The write_node tool is always exposed; configuration alone does not prevent writes.

version: 2

connection:
  endpointUrl: opc.tcp://localhost:4840
  securityMode: None
  securityPolicy: None
  auth:
    type: usernamePassword
    username: ${OPCUA_USERNAME}
    password: ${OPCUA_PASSWORD}

read:
  defaultBrowseDepth: 1
  maxBrowseDepth: 10
  maxReadBatchSize: 50
  roots:
    - nodeId: ns=2;s=Machine
      label: machine
      description: Main machine address space.

audit:
  file: ./audit.jsonl
  maxReasonLength: 1000
