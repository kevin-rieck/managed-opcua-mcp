# Simulator-only: None security and anonymous access are insecure.
# OPC UA Server account permissions enforce write authorization, including anonymous sessions.
# Write only to an explicitly designated safe simulator Node.

version: 2

connection:
  endpointUrl: opc.tcp://localhost:4840
  securityMode: None
  securityPolicy: None
  auth:
    type: anonymous

read:
  defaultBrowseDepth: 1
  maxBrowseDepth: 10
  maxReadBatchSize: 50
  roots:
    - nodeId: ns=2;s=Machine
      label: machine
      description: Main machine address space.

audit:
  file: ./audit.jsonl
  maxReasonLength: 1000
